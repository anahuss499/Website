<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mahmood Masjid — Admin Panel</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-dark: #0F291F;
      --green: #16382C;
      --green-mid: #1F5C46;
      --gold: #B08D3F;
      --gold-light: #F4D98A;
      --cream: #F7F3EA;
      --card: #FFFFFF;
      --ink: #26291F;
      --muted: #6E7263;
      --muted-light: #8A8D7C;
      --faint: #B4B79F;
      --border: #E4DCC7;
      --border-soft: #F0EBDD;
      --danger: #A6483F;
      --danger-bg: #FBF1EF;
      --danger-border: #E7C9C4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--cream);
      color: var(--ink);
    }

    body.rtl {
      font-family: 'Noto Nastaliq Urdu', 'Segoe UI', Tahoma, sans-serif;
      direction: rtl;
    }

    body.rtl .serif {
      font-family: 'Noto Nastaliq Urdu', Georgia, serif;
    }

    body.rtl input,
    body.rtl select,
    body.rtl textarea {
      font-family: 'Noto Nastaliq Urdu', system-ui, sans-serif;
    }

    .serif {
      font-family: Georgia, 'Iowan Old Style', serif;
    }

    input,
    select,
    textarea,
    button {
      font-family: inherit;
    }

    input,
    select,
    textarea {
      border: 1px solid #DDD5BE;
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 14px;
      background: #FCFAF5;
      color: var(--ink);
      outline: none;
      width: 100%;
    }

    input[type="file"] {
      padding: 7px 8px;
      font-size: 12.5px;
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    label.field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 13px;
      color: #4B4E40;
    }

    label.field span {
      font-weight: 600;
    }

    .field-full {
      grid-column: 1 / -1;
    }

    button {
      cursor: pointer;
    }

    .btn-primary {
      background: var(--green-mid);
      color: #FBF6E9;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 13.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-secondary {
      background: #fff;
      color: var(--green-mid);
      border: 1px solid var(--green-mid);
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 13.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-danger-outline {
      border: 1px solid var(--danger-border);
      background: var(--danger-bg);
      color: var(--danger);
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 13.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid #DDD5BE;
      color: #4B4E40;
      border-radius: 7px;
      padding: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn.danger {
      border-color: var(--danger-border);
      color: var(--danger);
    }

    .pill {
      border: 1px solid #DDD5BE;
      background: #fff;
      color: #4B4E40;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12.5px;
      font-weight: 600;
    }

    .pill.active {
      border-color: var(--green-mid);
      background: var(--green-mid);
      color: #fff;
    }

    .lang-pill {
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: transparent;
      color: #C9D6CC;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      flex: 1;
    }

    .lang-pill.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #1A2E22;
    }

    /* ---------- lock screen ---------- */
    #lock-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 0%, #1E4636, #0F2A22 70%);
      padding: 20px;
    }

    .lock-card {
      background: #FBF8F1;
      border-radius: 16px 16px 20px 20px;
      padding: 34px 30px;
      width: 340px;
      max-width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .arch-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-light);
      background: linear-gradient(180deg, #2A6E54, #14342A);
    }

    .lock-title {
      font-size: 21px;
      font-weight: 700;
      color: #1A2E22;
    }

    .lock-sub {
      color: var(--muted-light);
      font-size: 13px;
      margin: 2px 0 22px;
    }

    .lock-error {
      color: var(--danger);
      font-size: 12.5px;
      margin: 8px 0;
    }

    .lock-note {
      font-size: 11px;
      color: var(--faint);
      margin-top: 16px;
      line-height: 1.5;
    }

    /* ---------- shell ---------- */
    #shell {
      display: flex;
      min-height: 100vh;
    }

    #sidebar {
      width: 230px;
      flex-shrink: 0;
      background: linear-gradient(180deg, #16382C, #0F291F);
      color: #EAE6D6;
      display: flex;
      flex-direction: column;
      padding: 22px 14px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 6px 22px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 16px;
    }

    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 17px 17px 6px 6px;
      font-size: 16px;
      overflow: hidden;
    }

    .brand-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-name {
      font-weight: 700;
      font-size: 15px;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 10.5px;
      color: #9FB3A6;
    }

    nav.navlist {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .navlink {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #D9D5C2;
      font-size: 13.5px;
      font-weight: 500;
      text-align: left;
      width: 100%;
    }

    body.rtl .navlink {
      text-align: right;
    }

    .navlink.active {
      background: rgba(255, 255, 255, 0.1);
      color: var(--gold-light);
      font-weight: 700;
    }

    .navlink svg {
      flex-shrink: 0;
    }

    .sidebar-footer {
      margin-top: auto;
      font-size: 11px;
      color: #7C9184;
      padding-top: 14px;
    }

    #topbar {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    #hamburger {
      border: none;
      background: transparent;
    }

    #main {
      flex: 1;
      min-width: 0;
      padding: 28px 32px;
      max-width: 1100px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 18px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .section-title {
      margin: 0;
      font-size: 24px;
      color: #1A2E22;
    }

    .section-sub {
      color: var(--muted-light);
      font-size: 13.5px;
      margin-top: 3px;
    }

    .stat-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 4px 4px 12px 12px;
      padding: 18px 20px;
      flex: 1 1 200px;
      min-width: 200px;
    }

    .stat-card.gold {
      border-top: 3px solid var(--gold);
    }

    .stat-card.danger {
      border-top: 3px solid var(--danger);
    }

    .stat-card.default {
      border-top: 3px solid var(--green-mid);
    }

    .stat-label {
      font-size: 12px;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 700;
      color: var(--ink);
      margin-top: 6px;
    }

    .stat-sub {
      font-size: 12.5px;
      color: var(--muted-light);
      margin-top: 4px;
    }

    .stat-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 26px;
    }

    .clock-card {
      background: linear-gradient(180deg, #1F5C46, #14342A);
      color: #F4EFDD;
      border-radius: 4px 4px 12px 12px;
      padding: 16px 20px;
      flex: 1 1 200px;
      min-width: 200px;
    }

    .clock-label {
      font-size: 11.5px;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: #BFE0CE;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .clock-time {
      font-size: 24px;
      font-weight: 700;
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
    }

    .clock-date {
      font-size: 12px;
      color: #C9D6CC;
      margin-top: 2px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .form-card {
      padding: 18px;
      display: grid;
      gap: 12px;
      align-items: end;
      margin-bottom: 22px;
    }

    .form-hint {
      font-size: 12.5px;
      color: var(--muted-light);
      margin-top: -12px;
      margin-bottom: 20px;
    }

    .or-divider {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--faint);
      font-weight: 700;
      align-self: center;
      text-align: center;
    }

    .table-wrap {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .table-head,
    .table-row {
      display: grid;
      padding: 11px 18px;
      font-size: 14px;
      align-items: center;
    }

    .table-head {
      padding: 10px 18px;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted-light);
      font-weight: 700;
      background: #FAF6EC;
    }

    .table-row {
      border-top: 1px solid var(--border-soft);
    }

    .row-list .table-row:first-child {
      border-top: none;
    }

    .empty-state {
      border: 1.5px dashed #DDD5BE;
      border-radius: 12px;
      padding: 36px 20px;
      text-align: center;
      color: var(--muted-light);
    }

    .empty-state .icon {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
      color: var(--gold);
    }

    .empty-state .title {
      font-weight: 700;
      color: #4B4E40;
      margin-bottom: 4px;
    }

    .grid-photos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .photo-thumb {
      width: 100%;
      aspect-ratio: 4/3;
      background-color: #F0EBDD;
      background-size: cover;
      background-position: center;
      cursor: zoom-in;
      position: relative;
    }

    .photo-cat {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: var(--gold);
      font-weight: 700;
    }

    .photo-caption {
      font-size: 13.5px;
      color: var(--ink);
      margin-top: 2px;
    }

    .grid-videos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .video-frame {
      aspect-ratio: 16/9;
      background: #000;
      position: relative;
    }

    .video-frame iframe,
    .video-frame video {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .expand-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(15, 41, 31, 0.72);
      color: #F4EFDD;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 7px;
      padding: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-in;
      z-index: 2;
    }

    body.rtl .expand-btn {
      right: auto;
      left: 8px;
    }

    .infra-item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      gap: 14px;
    }

    .infra-badge {
      width: 38px;
      height: 38px;
      border-radius: 19px 19px 6px 6px;
      flex-shrink: 0;
    }

    .infra-loc {
      font-size: 13.5px;
      color: #4B4E40;
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .infra-notes {
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
    }

    .infra-date {
      font-size: 11.5px;
      color: var(--faint);
      margin-top: 8px;
    }

    .infra-media {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .infra-media img {
      width: 110px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: zoom-in;
    }

    .infra-media .infra-video-wrap {
      position: relative;
      width: 150px;
      height: 80px;
    }

    .infra-media video {
      width: 150px;
      height: 80px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #000;
    }

    .infra-media .infra-video-wrap .expand-btn {
      top: 4px;
      right: 4px;
      padding: 4px;
    }

    .prayer-month-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .prayer-months-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }

    .cal-nav-btn {
      border: 1px solid #DDD5BE;
      background: #fff;
      border-radius: 8px;
      padding: 6px;
      display: inline-flex;
    }

    .cal-table-row {
      display: grid;
      grid-template-columns: .7fr .7fr repeat(6, 1fr);
      padding: 9px 16px;
      font-size: 13px;
      border-top: 1px solid var(--border-soft);
    }

    .cal-table-head {
      display: grid;
      grid-template-columns: .7fr .7fr repeat(6, 1fr);
      padding: 10px 16px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: var(--muted-light);
      font-weight: 700;
      background: #FAF6EC;
    }

    .cal-scroll {
      max-height: 480px;
      overflow-y: auto;
    }

    .settings-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      max-width: 420px;
      margin-bottom: 20px;
    }

    .settings-card h3 {
      margin: 0 0 12px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-preview {
      max-width: 120px;
      max-height: 120px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
      display: block;
      object-fit: cover;
    }

    /* ---------- lightbox ---------- */
    #lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 20, 15, 0.88);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      cursor: zoom-out;
      animation: lightbox-fade .15s ease-out;
    }

    @keyframes lightbox-fade {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    #lightbox-overlay .lightbox-inner {
      cursor: default;
      max-width: 95vw;
      max-height: 95vh;
      position: relative;
    }

    #lightbox-overlay .lightbox-close {
      position: absolute;
      top: -14px;
      right: -14px;
      background: #FBF6E9;
      color: #1A2E22;
      border: none;
      border-radius: 999px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    @media print {

      #sidebar,
      #topbar,
      .form-card,
      .section-header button,
      #main>form {
        display: none !important;
      }

      body {
        background: #fff;
      }

      #main {
        padding: 0;
        max-width: none;
      }
    }

    @media (max-width: 860px) {
      #sidebar {
        display: none;
        position: fixed;
        z-index: 50;
        box-shadow: 8px 0 30px rgba(0, 0, 0, 0.3);
      }

      #sidebar.open {
        display: flex;
      }

      #topbar {
        display: flex;
      }

      #main {
        padding: 20px;
      }

      .stat-card,
      .clock-card {
        min-width: 160px;
      }
    }

    @media (max-width: 700px) {
      .form-card {
        grid-template-columns: 1fr !important;
      }

      .or-divider {
        padding: 2px 0;
      }

      .table-head {
        display: none;
      }

      .table-row {
        grid-template-columns: 1fr !important;
        gap: 3px;
        padding: 12px 14px;
      }

      .table-wrap {
        overflow-x: auto;
      }

      .cal-table-head,
      .cal-table-row {
        min-width: 640px;
      }

      .section-title {
        font-size: 20px;
      }

      #main {
        padding: 16px;
      }

      .lock-card {
        width: 100%;
        padding: 28px 20px;
      }

      .infra-item {
        flex-direction: column;
      }
    }

    @media (max-width: 420px) {

      .stat-card,
      .clock-card {
        min-width: 100%;
        flex-basis: 100%;
      }

      .grid-photos,
      .grid-videos {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    /* ---------- helpers ---------- */
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
    function todayISO() { return new Date().toISOString().slice(0, 10); }
    function currency(n) {
      const v = Number(n) || 0;
      const num = v.toLocaleString("en-PK", { maximumFractionDigits: 0 });
      return state.lang === "ur" ? (num + " روپے") : ("Rs. " + num);
    }
    function escapeHtml(str) {
      return String(str == null ? "" : str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function safeUrl(url) {
      const u = String(url || "").trim();
      if (/^https?:\/\//i.test(u) || /^data:(image|video)\//i.test(u)) return u;
      return "";
    }
    function emptyMonthlyTimes() { return { fajr: "", sunrise: "", dhuhr: "", asr: "", maghrib: "", isha: "", jumma: "" }; }
    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("read failed"));
        reader.readAsDataURL(file);
      });
    }
    function optionsFor(list, map, selected) {
      return list.map(v => `<option value="${escapeHtml(v)}" ${selected === v ? "selected" : ""}>${escapeHtml(t(map[v]))}</option>`).join("");
    }
    function confirmDelete(messageKey, onConfirm) {
      if (window.confirm(t(messageKey))) onConfirm();
    }

    /* ---------- lightbox (click to enlarge photos/videos) ---------- */
    function closeLightbox() {
      const el = document.getElementById("lightbox-overlay");
      if (el) el.remove();
    }
    function openLightbox(innerHtml) {
      closeLightbox();
      const overlay = document.createElement("div");
      overlay.id = "lightbox-overlay";
      overlay.innerHTML = `<div class="lightbox-inner">${innerHtml}<button class="lightbox-close" aria-label="Close">${ICONS.close}</button></div>`;
      overlay.addEventListener("click", (e) => { if (e.target === overlay) closeLightbox(); });
      overlay.querySelector(".lightbox-close").addEventListener("click", closeLightbox);
      document.addEventListener("keydown", escCloseOnce);
      document.body.appendChild(overlay);
    }
    function escCloseOnce(e) {
      if (e.key === "Escape") { closeLightbox(); document.removeEventListener("keydown", escCloseOnce); }
    }
    function openImageLightbox(url) {
      const u = safeUrl(url);
      if (!u) return;
      openLightbox(`<img src="${u}" style="max-width:95vw;max-height:95vh;object-fit:contain;border-radius:8px;display:block;" />`);
    }
    function openEmbedVideoLightbox(embedUrl, title) {
      const u = safeUrl(embedUrl) || embedUrl;
      openLightbox(`<div style="width:90vw;max-width:960px;aspect-ratio:16/9;"><iframe src="${u}" title="${escapeHtml(title || 'video')}" style="width:100%;height:100%;border:none;border-radius:8px;" allowfullscreen></iframe></div>`);
    }
    function openUploadedVideoLightbox(url) {
      const u = safeUrl(url);
      if (!u) return;
      openLightbox(`<video src="${u}" controls autoplay style="max-width:95vw;max-height:95vh;border-radius:8px;"></video>`);
    }
    /* Delegated so it keeps working across re-renders without rebinding */
    function handleGlobalLightboxClick(e) {
      const imgEl = e.target.closest("[data-lightbox-img]");
      if (imgEl) { openImageLightbox(imgEl.getAttribute("data-lightbox-img")); return; }
      const vidEl = e.target.closest("[data-lightbox-video]");
      if (vidEl) {
        const url = vidEl.getAttribute("data-lightbox-video");
        if (vidEl.getAttribute("data-video-type") === "embed") openEmbedVideoLightbox(url, vidEl.getAttribute("data-video-title"));
        else openUploadedVideoLightbox(url);
      }
    }

    /* ---------- storage (localStorage) ---------- */
    const store = {
      get(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          if (raw == null) return fallback;
          return JSON.parse(raw);
        } catch (e) { return fallback; }
      },
      set(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); return true; }
        catch (e) { console.error("Storage save failed", key, e); return false; }
      }
    };

    /* ---------- passcode hashing (SHA-256, one-way, local only) ---------- */
    async function hashPasscode(pass) {
      const enc = new TextEncoder().encode(String(pass));
      const buf = await crypto.subtle.digest("SHA-256", enc);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

          const remaining = Math.max(0, Math.ceil((lockInfo.lockUntil - Date.now()) / 1000));
          errorEl.textContent = t("err_locked", { s: remaining });
          if (remaining <= 0) { clearInterval(lockCountdownInterval); renderLock(); }
        };
        tick();
        lockCountdownInterval = setInterval(tick, 1000);
      }
      document.getElementById("lock-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const currentLockInfo = getLockInfo();
        if (currentLockInfo.lockUntil && currentLockInfo.lockUntil > Date.now()) return;
        const val = document.getElementById("lock-val").value;
        const errorEl = document.getElementById("lock-error");
        if (!hasPasscode) {
          const confirmVal = document.getElementById("lock-confirm").value;
          if (val.length < 4) { errorEl.textContent = t("err_min_chars"); return; }
          if (val !== confirmVal) { errorEl.textContent = t("err_mismatch"); return; }
          const h = await hashPasscode(val);
          state.passcodeHash = h;
          store.set("mm_passcode_hash", h);
          setLockInfo({ attempts: 0, lockUntil: 0 });
          state.unlocked = true;
          render();
        } else {
          const h = await hashPasscode(val);
          if (h === state.passcodeHash) {
            setLockInfo({ attempts: 0, lockUntil: 0 });
            state.unlocked = true;
            render();
          } else {
            const info = getLockInfo();
            const attempts = (info.attempts || 0) + 1;
            if (attempts >= LOCK_MAX_ATTEMPTS) {
              setLockInfo({ attempts: 0, lockUntil: Date.now() + LOCK_DURATION_MS });
              renderLock();
            } else {
              setLockInfo({ attempts, lockUntil: 0 });
              errorEl.textContent = t("err_incorrect");
            }
          }
        }
      });
      document.querySelectorAll("[data-lang]").forEach(btn => {
        btn.addEventListener("click", () => setLang(btn.getAttribute("data-lang")));
      });
      if (!isLocked) document.getElementById("lock-val").focus();
    }

      const now = new Date();

        timeZone, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true
      }).format(now);
      const date = new Intl.DateTimeFormat(state.lang === "ur" ? "ur" : "en-GB", {
        timeZone, weekday: "short", day: "numeric", month: "short", year: "numeric"
      }).format(now);
      return { time, date };
    }

        const u = new URL(url);

        if (u.hostname.includes("youtube.com")) {
          const id = u.searchParams.get("v");
          if (id) return "https://www.youtube.com/embed/" + id;
          if (u.pathname.startsWith("/embed/")) return url;
        }
      } catch (e) { /* not a valid URL */ }
      return url;

    ${sectionHeader(t("infra_title"), t("infra_sub"))}
    <form id="infra-form" class="card form-card" style="grid-template-columns:1fr 1fr;">
      <label class="field"><span>${t('field_type')}</span><select id="i-type">${optionsFor(INFRA_TYPES, ITYPE_KEY_MAP)}</select></label>
      <label class="field"><span>${t('field_floor')}</span><select id="i-floor">${optionsFor(FLOORS, FLOOR_KEY_MAP)}</select></label>
      <label class="field field-full"><span>${t('field_location')}</span><input type="text" id="i-loc" placeholder="${t('ph_location')}" required /></label>
      <label class="field field-full"><span>${t('field_notes')}</span><textarea id="i-notes" placeholder="${t('ph_notes')}"></textarea></label>
      <label class="field"><span>${t('field_ref_photo')}</span><input type="url" id="i-photo-url" placeholder="https://..." /></label>
      <label class="field"><span>${t('field_upload_photo')}</span><input type="file" id="i-photo-file" accept="image/*" /></label>
      <label class="field"><span>${t('field_ref_video')}</span><input type="url" id="i-video-url" placeholder="https://..." /></label>
      <label class="field"><span>${t('field_upload_video')}</span><input type="file" id="i-video-file" accept="video/*" /></label>
      <label class="field"><span>${t('field_date_logged')}</span><input type="date" id="i-date" value="${todayISO()}" /></label>
      <div class="field-full"><button type="submit" class="btn-primary">${ICONS.plus} ${t('btn_log_item')}</button></div>
    </form>
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
      <button class="pill ${state.infraFilter === 'All' ? 'active' : ''}" data-filter="All">${state.lang === 'ur' ? 'تمام' : 'All'}</button>
      ${INFRA_TYPES.map(t2 => `<button class="pill ${state.infraFilter === t2 ? 'active' : ''}" data-filter="${t2}">${escapeHtml(t(ITYPE_KEY_MAP[t2]))}</button>`).join("")}
    </div>
    ${filtered.length === 0 ? emptyState(ICONS.infra, t("empty_infra_title"), t("empty_infra_text")) : `
      <div style="display:grid;gap:12px;">
        ${filtered.map(i => `
          <div class="infra-item">
            <div class="arch-badge infra-badge">${ICONS.infra}</div>
            <div style="flex:1;min-width:0;">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                <div>
                  <div style="font-weight:700;font-size:14.5px;">${escapeHtml(t(ITYPE_KEY_MAP[i.type] || i.type))} <span style="font-weight:500;color:var(--muted-light);">&middot; ${escapeHtml(t(FLOOR_KEY_MAP[i.floor] || i.floor))}</span></div>
                  <div class="infra-loc">${ICONS.pin} ${escapeHtml(i.location)}</div>
                </div>
                <button class="icon-btn danger" data-del="${i.id}" title="${t('btn_delete')}">${ICONS.trash}</button>
              </div>
              ${i.notes ? `<div class="infra-notes">${escapeHtml(i.notes)}</div>` : ""}
              ${(i.photoUrl || i.videoUrl) ? `
                <div class="infra-media">
                  ${i.photoUrl ? `<img src="${safeUrl(i.photoUrl)}" alt="" data-lightbox-img="${escapeHtml(safeUrl(i.photoUrl))}" />` : ""}
                  ${i.videoUrl ? `<div class="infra-video-wrap"><video controls src="${safeUrl(i.videoUrl)}"></video><button class="expand-btn" title="${state.lang === 'ur' ? 'بڑا کریں' : 'Enlarge'}" data-lightbox-video="${escapeHtml(safeUrl(i.videoUrl))}" data-video-type="upload">${ICONS.expand}</button></div>` : ""}
                </div>
              ` : ""}
              <div class="infra-date">${t("logged_on", { date: escapeHtml(i.date) })}</div>
            </div>
          </div>
        `).join("")}
      </div>
    `}
  `;
    }
    function bindInfra() {
      document.getElementById("infra-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const location = document.getElementById("i-loc").value.trim();
        if (!location) return;
        let photoUrl = document.getElementById("i-photo-url").value.trim();
        let videoUrl = document.getElementById("i-video-url").value.trim();
        const photoFile = document.getElementById("i-photo-file");
        const videoFile = document.getElementById("i-video-file");
        try {
          if (photoFile.files && photoFile.files[0]) photoUrl = await readFileAsDataURL(photoFile.files[0]);
          if (videoFile.files && videoFile.files[0]) videoUrl = await readFileAsDataURL(videoFile.files[0]);
        } catch (err) { alert("Could not read that file."); return; }
        const entry = {
          id: uid(), type: document.getElementById("i-type").value, floor: document.getElementById("i-floor").value,
          location, notes: document.getElementById("i-notes").value.trim(),
          photoUrl, videoUrl, date: document.getElementById("i-date").value,
        };
        state.infra = [entry, ...state.infra];
        if (!persist("infra")) {
          state.infra = state.infra.filter(i => i.id !== entry.id);
          alert(t("storage_full_warning"));
          return;
        }
        renderMain();
      });
      document.querySelectorAll("[data-filter]").forEach(btn => {
        btn.addEventListener("click", () => { state.infraFilter = btn.getAttribute("data-filter"); renderMain(); });
      });
      document.querySelectorAll("[data-del]").forEach(btn => {
        btn.addEventListener("click", () => {
          confirmDelete("confirm_delete_infra", () => {
            state.infra = state.infra.filter(i => i.id !== btn.getAttribute("data-del"));
            persist("infra");
            renderMain();
          });
        });
      });
    }

    /* ================= MOSQUE LAYOUT ================= */
    function viewLayout() {
      return `
    ${sectionHeader(t("layout_title"), t("layout_sub"))}
    <form id="layout-form" class="card form-card" style="grid-template-columns:1.6fr auto 1.6fr 1fr 1fr auto;">
      <label class="field"><span>${t('field_image_url')}</span><input type="url" id="l-url" placeholder="https://..." /></label>
      <div class="or-divider">${state.lang === 'ur' ? 'یا' : 'or'}</div>
      <label class="field"><span>${t('field_upload_photo')}</span><input type="file" id="l-file" accept="image/*" /></label>
      <label class="field"><span>${t('field_layout_title')}</span><input type="text" id="l-title" placeholder="${t('ph_layout_title')}" /></label>
      <label class="field"><span>${t('field_floor')}</span><select id="l-floor">${optionsFor(FLOORS, FLOOR_KEY_MAP)}</select></label>
      <button type="submit" class="btn-primary">${ICONS.plus} ${t('btn_add')}</button>
    </form>
    <div class="form-hint">${t('hint_layout')}</div>
    ${state.layout.length === 0 ? emptyState(ICONS.layout, t("empty_layout_title"), t("empty_layout_text")) : `
      <div class="grid-photos">
        ${state.layout.map(l => `
          <div class="card" style="overflow:hidden;">
            <div class="photo-thumb" data-lightbox-img="${escapeHtml(safeUrl(l.url))}" style="background-image:url('${safeUrl(l.url).replace(/'/g, "%27")}');"></div>
            <div style="padding:10px 12px;">
              <div class="photo-cat">${escapeHtml(t(FLOOR_KEY_MAP[l.floor] || l.floor))}</div>
              <div class="photo-caption">${escapeHtml(l.title || t("untitled"))}</div>
              <div style="display:flex;justify-content:flex-end;margin-top:8px;">
                <button class="icon-btn danger" data-del="${l.id}" title="${t('btn_remove')}">${ICONS.trash}</button>
              </div>
            </div>
          </div>
        `).join("")}
      </div>
    `}
  `;
    }
    function bindLayout() {
      document.getElementById("layout-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById("l-file");
        const urlVal = document.getElementById("l-url").value.trim();
        let url = urlVal;
        if (fileInput.files && fileInput.files[0]) {
          try { url = await readFileAsDataURL(fileInput.files[0]); }
          catch (err) { alert("Could not read that file."); return; }
        }
        if (!url) return;
        const entry = { id: uid(), url, title: document.getElementById("l-title").value.trim(), floor: document.getElementById("l-floor").value };
        state.layout = [entry, ...state.layout];
        if (!persist("layout")) {
          state.layout = state.layout.filter(l => l.id !== entry.id);
          alert(t("storage_full_warning"));
          return;
        }
        renderMain();
      });
      document.querySelectorAll("[data-del]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          confirmDelete("confirm_delete_layout", () => {
            state.layout = state.layout.filter(l => l.id !== btn.getAttribute("data-del"));
            persist("layout");
            renderMain();
          });
        });
      });
    }

    /* ================= PRAYER TIMES ================= */
    function viewPrayer() {
      const modeButtons = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="pill ${state.prayerMode === 'calendar' ? 'active' : ''}" data-mode="calendar">${t('mode_calendar')}</button>
      <button class="pill ${state.prayerMode === 'edit' ? 'active' : ''}" data-mode="edit">${t('mode_edit')}</button>
      ${state.prayerMode === 'calendar' ? `<button class="btn-secondary" id="prayer-print">${ICONS.download} ${t('btn_download_pdf')}</button>` : ""}
    </div>
  `;
      let body;
      if (state.prayerMode === "edit") {
        body = `
      <div style="font-size:13px;color:var(--muted-light);margin-bottom:14px;">
        ${t('edit_intro')}
      </div>
      <div class="prayer-months-grid">
        ${MONTHS_EN.map((_, idx) => {
          const t3 = state.prayer.monthly[idx] || emptyMonthlyTimes();
          return `
            <div class="prayer-month-card">
              <div style="font-weight:700;margin-bottom:10px;">${monthName(idx)}</div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                ${TIME_FIELDS.map(f => `
                  <label class="field"><span>${t(f.labelKey)}</span><input type="time" data-month="${idx}" data-field="${f.key}" value="${t3[f.key] || ""}" /></label>
                `).join("")}
                <label class="field"><span>${t('lbl_jumma')}</span><input type="time" data-month="${idx}" data-field="jumma" value="${t3.jumma || ""}" /></label>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    `;
      } else {
        const year = state.prayerYear, monthIdx = state.prayerMonthIdx;
        const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
        const base = state.prayer.monthly[monthIdx] || emptyMonthlyTimes();
        const overrides = state.prayer.overrides || [];
        const today = todayISO();
        const rows = Array.from({ length: daysInMonth }, (_, i) => {
          const dayNum = i + 1;
          const dateObj = new Date(year, monthIdx, dayNum);
          const iso = dateObj.toISOString().slice(0, 10);
          const isFriday = dateObj.getDay() === 5;
          const override = overrides.find(o => o.date === iso);
          const times = { ...base, ...(override || {}) };
          return { dayNum, iso, isFriday, weekday: dayName(dateObj.getDay()), times, isToday: iso === today };
        });
        body = `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
        <button class="cal-nav-btn" id="prev-month">${ICONS.chevLeft}</button>
        <div style="font-weight:700;font-size:16px;min-width:160px;text-align:center;">${monthName(monthIdx)} ${year}</div>
        <button class="cal-nav-btn" id="next-month">${ICONS.chevRight}</button>
        <input type="number" id="cal-year" value="${year}" style="width:90px;margin-inline-start:8px;" />
      </div>
      <div class="table-wrap">
        <div class="cal-table-head">
          <span>${t('col_date')}</span><span>${t('col_day')}</span><span>${t('lbl_fajr')}</span><span>${t('lbl_sunrise')}</span><span>${t('lbl_dhuhr')}</span><span>${t('lbl_asr')}</span><span>${t('lbl_maghrib')}</span><span>${t('lbl_isha')}</span>
        </div>
        <div class="cal-scroll">
          ${rows.map(r => `
            <div class="cal-table-row" style="background:${r.isToday ? '#F3F8F1' : (r.isFriday ? '#FBF6EC' : 'transparent')};">
              <span style="font-weight:600;">${r.dayNum}</span>
              <span style="color:${r.isFriday ? 'var(--gold)' : 'var(--muted)'};font-weight:${r.isFriday ? 700 : 400};">${r.weekday}</span>
              <span>${r.times.fajr || "—"}</span>
              <span>${r.times.sunrise || "—"}</span>
              <span>${r.isFriday ? (r.times.jumma ? `${t('lbl_jumma')} ${r.times.jumma}` : (r.times.dhuhr || "—")) : (r.times.dhuhr || "—")}</span>
              <span>${r.times.asr || "—"}</span>
              <span>${r.times.maghrib || "—"}</span>
              <span>${r.times.isha || "—"}</span>
            </div>
          `).join("")}
        </div>
      </div>
    `;
      }
      return `${sectionHeader(t("prayer_title"), t("prayer_sub"), modeButtons)}${body}`;
    }
    function bindPrayer() {
      document.querySelectorAll("[data-mode]").forEach(btn => {
        btn.addEventListener("click", () => { state.prayerMode = btn.getAttribute("data-mode"); renderMain(); });
      });
      if (state.prayerMode === "edit") {
        document.querySelectorAll("[data-month]").forEach(input => {
          input.addEventListener("change", () => {
            const m = Number(input.getAttribute("data-month"));
            const field = input.getAttribute("data-field");
            state.prayer.monthly[m] = { ...(state.prayer.monthly[m] || emptyMonthlyTimes()), [field]: input.value };
            persist("prayer");
          });
        });
      } else {
        document.getElementById("prev-month").addEventListener("click", () => {
          state.prayerMonthIdx = state.prayerMonthIdx === 0 ? 11 : state.prayerMonthIdx - 1;
          if (state.prayerMonthIdx === 11) state.prayerYear -= 1;
          renderMain();
        });
        document.getElementById("next-month").addEventListener("click", () => {
          state.prayerMonthIdx = state.prayerMonthIdx === 11 ? 0 : state.prayerMonthIdx + 1;
          if (state.prayerMonthIdx === 0) state.prayerYear += 1;
          renderMain();
        });
        document.getElementById("cal-year").addEventListener("change", (e) => {
          state.prayerYear = Number(e.target.value) || state.prayerYear;
          renderMain();
        });
        const printBtn = document.getElementById("prayer-print");
        if (printBtn) printBtn.addEventListener("click", () => window.print());
      }
    }

    /* ================= SETTINGS ================= */
    function viewSettings() {
      return `
    ${sectionHeader(t("settings_title"), t("settings_sub"))}
    <div class="settings-card">
      <h3>${ICONS.image} ${t('card_logo_title')}</h3>
      <div style="font-size:12.5px;color:var(--muted-light);margin-bottom:10px;">${t('logo_hint')}</div>
      ${state.logo ? `<img class="logo-preview" src="${state.logo}" />` : ""}
      <form id="logo-form" style="display:grid;gap:10px;">
        <label class="field"><span>${t('field_image_url')}</span><input type="url" id="logo-url" placeholder="https://..." value="${state.logo && !String(state.logo).startsWith('data:') ? escapeHtml(state.logo) : ''}" /></label>
        <label class="field"><span>${t('field_upload_photo')}</span><input type="file" id="logo-file" accept="image/*" /></label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button type="submit" class="btn-primary">${t('btn_save_logo')}</button>
          ${state.logo ? `<button type="button" id="logo-remove" class="btn-danger-outline">${t('btn_remove_logo')}</button>` : ""}
        </div>
      </form>
    </div>
    <div class="settings-card">
      <h3>${ICONS.key} ${t('card_passcode_title')}</h3>
      <form id="passcode-form" style="display:grid;gap:10px;">
        <label class="field"><span>${t('field_current_passcode')}</span><input type="password" id="s-old" /></label>
        <label class="field"><span>${t('field_new_passcode')}</span><input type="password" id="s-new" /></label>
        <button type="submit" class="btn-primary" style="justify-content:center;">${t('btn_update_passcode')}</button>
        <div id="s-msg" style="font-size:12.5px;"></div>
      </form>
    </div>
    <div class="settings-card">
      <h3 style="color:var(--danger);">${ICONS.shield} ${t('card_reset_title')}</h3>
      <div style="font-size:13px;color:var(--muted);margin-bottom:12px;">
        ${t('reset_warning')}
      </div>
      <button id="reset-all" class="btn-danger-outline">${ICONS.reset} ${t('btn_reset_everything')}</button>
    </div>
    <div style="font-size:11.5px;color:var(--faint);max-width:420px;">
      ${t('storage_note')}
    </div>
  `;
    }
    function bindSettings() {
      document.getElementById("logo-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById("logo-file");
        let url = document.getElementById("logo-url").value.trim();
        if (fileInput.files && fileInput.files[0]) {
          try { url = await readFileAsDataURL(fileInput.files[0]); }
          catch (err) { alert("Could not read that file."); return; }
        }
        if (!url) return;
        const prevLogo = state.logo;
        state.logo = url;
        if (!store.set("mm_logo", url)) {
          state.logo = prevLogo;
          alert(t("storage_full_warning"));
          return;
        }
        renderShell();
      });
      const removeBtn = document.getElementById("logo-remove");
      if (removeBtn) removeBtn.addEventListener("click", () => {
        state.logo = null;
        store.set("mm_logo", null);
        renderShell();
      });
      document.getElementById("passcode-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const oldP = document.getElementById("s-old").value;
        const newP = document.getElementById("s-new").value;
        const msg = document.getElementById("s-msg");
        const oldHash = await hashPasscode(oldP);
        if (oldHash !== state.passcodeHash) { msg.style.color = "var(--danger)"; msg.textContent = t("msg_current_incorrect"); return; }
        if (!newP || newP.length < 4) { msg.style.color = "var(--danger)"; msg.textContent = t("msg_new_min"); return; }
        const newHash = await hashPasscode(newP);
        state.passcodeHash = newHash;
        store.set("mm_passcode_hash", newHash);
        msg.style.color = "var(--green-mid)";
        msg.textContent = t("msg_updated");
        document.getElementById("s-old").value = "";
        document.getElementById("s-new").value = "";
      });
      document.getElementById("reset-all").addEventListener("click", () => {
        if (!window.confirm(t("confirm_reset"))) return;
        state.donations = []; state.expenses = []; state.photos = []; state.videos = []; state.infra = []; state.layout = [];
        state.prayer = { monthly: Array.from({ length: 12 }, emptyMonthlyTimes), overrides: [] };
        persist("donations"); persist("expenses"); persist("photos"); persist("videos"); persist("infra"); persist("layout"); persist("prayer");
        renderMain();
      });
    }

    /* ---------- boot ---------- */
    render();
  </script>
</body>

</html>
